<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | My FarmAgro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .marketplace-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        
        .marketplace-header {
            background: linear-gradient(135deg, #2d6a2f, #1a472a);
            border-radius: 16px;
            padding: 32px;
            color: white;
            margin-bottom: 32px;
            text-align: center;
        }
        
        .marketplace-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e4e9f0;
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 600;
            color: #6b7a8a;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #2d6a2f;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        
        .product-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e4e9f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        
        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a2533;
        }
        
        .product-farmer {
            color: #6b7a8a;
            font-size: 0.8rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .product-farmer i {
            color: #2d6a2f;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d6a2f;
            margin: 12px 0;
        }
        
        .product-price small {
            font-size: 0.7rem;
            font-weight: normal;
            color: #8a9bb0;
        }
        
        .product-quantity {
            color: #4a5b6e;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        
        .btn-buy {
            width: 100%;
            background: #2d6a2f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-buy:hover {
            background: #1a472a;
        }
        
        .sell-form {
            background: white;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #e4e9f0;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a2533;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d9e6;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2d6a2f;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .btn-submit {
            background: #2d6a2f;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        
        .listing-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e4e9f0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .listing-info h4 {
            margin-bottom: 4px;
            font-size: 1.1rem;
        }
        
        .listing-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .listing-status.available {
            background: #e8f0ea;
            color: #2d6a2f;
        }
        
        .listing-status.sold {
            background: #fde8e8;
            color: #d9534f;
        }
        
        .listing-status.pending {
            background: #fff3e0;
            color: #f5b642;
        }
        
        .listing-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            font-size: 1.2rem;
            color: #d9534f;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #8a9bb0;
        }
        
        .success-message {
            background: #e8f0ea;
            color: #2d6a2f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-message {
            background: #fde8e8;
            color: #d9534f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        @media (max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <div class="logo"><i class="fas fa-seedling"></i> My FarmAgro</div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="marketplace.html" style="color:#2d6a2f; font-weight:700;">Marketplace</a>
                <a href="profile.html">Profile</a>
                <button class="btn-outline" id="logoutBtn">Log Out</button>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="marketplace-container">
        <div class="marketplace-header">
            <h1><i class="fas fa-store"></i> Farmers Marketplace</h1>
            <p>Buy fresh produce directly from local farmers or sell your harvest</p>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="buy">🛒 Buy Produce</button>
            <button class="tab" data-tab="sell">🌾 Sell Your Harvest</button>
            <button class="tab" data-tab="listings">📋 My Listings</button>
            <button class="tab" data-tab="orders">📦 My Orders</button>
        </div>

        <div id="buyTab" class="tab-content active">
            <div id="productsGrid" class="products-grid">
                <div class="empty-state">Loading products...</div>
            </div>
        </div>

        <div id="sellTab" class="tab-content">
            <div class="sell-form">
                <h2 style="margin-bottom: 24px;">List Your Produce</h2>
                <div id="sellMessage"></div>
                <form id="sellForm">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g., Fresh Chilies, Organic Tomatoes" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="productCategory">
                                <option value="Vegetables">Vegetables</option>
                                <option value="Fruits">Fruits</option>
                                <option value="Herbs">Herbs & Spices</option>
                                <option value="Grains">Grains & Pulses</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Unit *</label>
                            <select id="productUnit">
                                <option value="kg">Kilogram (kg)</option>
                                <option value="g">Gram (g)</option>
                                <option value="bunch">Bunch</option>
                                <option value="piece">Piece</option>
                                <option value="box">Box</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Price (RM) *</label>
                            <input type="number" id="productPrice" step="0.5" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Quantity Available *</label>
                            <input type="number" id="productQuantity" placeholder="e.g., 10" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="productDescription" rows="3" placeholder="Describe your product (organic, fresh, harvest date, location, etc.)"></textarea>
                    </div>
                    <button type="submit" class="btn-submit">List for Sale →</button>
                </form>
            </div>
        </div>

        <div id="listingsTab" class="tab-content">
            <div id="myListingsContainer"></div>
        </div>

        <div id="ordersTab" class="tab-content">
            <div id="ordersContainer"></div>
        </div>
    </div>
</main>

<div id="orderModal" class="modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:2000;">
    <div style="background:white; max-width:500px; width:90%; border-radius:16px; padding:28px;">
        <h3 id="orderProductName" style="margin-bottom:16px;">Confirm Order</h3>
        <p><strong>Farmer:</strong> <span id="orderFarmer"></span></p>
        <p><strong>Price:</strong> RM<span id="orderPrice"></span> per unit</p>
        <div class="form-group">
            <label>Quantity to buy</label>
            <input type="number" id="orderQuantity" min="1" value="1" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <p style="margin-top:16px;"><strong>Total:</strong> RM<span id="orderTotal">0</span></p>
        <div class="form-group">
            <label>Delivery Address</label>
            <textarea id="orderAddress" rows="2" placeholder="Your delivery address" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button id="confirmOrderBtn" style="flex:1; background:#2d6a2f; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer;">Place Order</button>
            <button id="closeOrderModalBtn" style="flex:1; background:#f0f4ea; border:none; padding:12px; border-radius:8px; cursor:pointer;">Cancel</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
    let currentUser = null;
    let userProfile = null;
    let currentOrderProduct = null;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.getAttribute('data-tab');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            if (tabName === 'buy') loadProducts();
            if (tabName === 'listings') loadMyListings();
            if (tabName === 'orders') loadMyOrders();
        });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = 'index.html';
    });

    // Load products for sale
    async function loadProducts() {
        const container = document.getElementById('productsGrid');
        container.innerHTML = '<div class="empty-state">Loading products...</div>';
        
        if (!currentUser) {
            container.innerHTML = '<div class="empty-state">Please log in to view products</div>';
            return;
        }
        
        try {
            const snapshot = await db.collection('marketplace_products')
                .where('status', '==', 'available')
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-state">No products available. Check back later!</div>';
                return;
            }
            
            let products = [];
            snapshot.forEach(doc => {
                const product = doc.data();
                product.id = doc.id;
                products.push(product);
            });
            products.sort((a, b) => {
                if (a.createdAt > b.createdAt) return -1;
                if (a.createdAt < b.createdAt) return 1;
                return 0;
            });
            
            let html = '';
            for (const product of products) {
                let farmerName = 'Local Farmer';
                if (product.farmerId) {
                    try {
                        const farmerDoc = await db.collection('users').doc(product.farmerId).get();
                        if (farmerDoc.exists) farmerName = farmerDoc.data().name || 'Local Farmer';
                    } catch(e) {}
                }
                
                html += `
                    <div class="product-card">
                        <div class="product-info">
                            <h3 class="product-title">${escapeHtml(product.name)}</h3>
                            <div class="product-farmer">
                                <i class="fas fa-user"></i> ${escapeHtml(farmerName)}
                            </div>
                            <div class="product-price">RM${product.price} <small>per ${product.unit}</small></div>
                            <div class="product-quantity"><i class="fas fa-box"></i> ${product.quantity} ${product.unit}s available</div>
                            <p style="font-size:0.85rem; color:#6b7a8a; margin-bottom:16px;">${escapeHtml(product.description || '')}</p>
                            <button class="btn-buy" onclick='openOrderModal("${product.id}", "${escapeHtml(product.name)}", "${escapeHtml(farmerName)}", ${product.price}, "${product.unit}")'>Buy Now</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (error) {
            console.error('Error loading products:', error);
            container.innerHTML = '<div class="empty-state">Error loading products. Please refresh.</div>';
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.openOrderModal = (productId, productName, farmerName, price, unit) => {
        currentOrderProduct = { id: productId, name: productName, farmerName, price, unit };
        document.getElementById('orderProductName').innerText = `Order: ${productName}`;
        document.getElementById('orderFarmer').innerText = farmerName;
        document.getElementById('orderPrice').innerText = price;
        document.getElementById('orderQuantity').value = 1;
        document.getElementById('orderTotal').innerText = price;
        document.getElementById('orderAddress').value = userProfile?.farmAddress || '';
        document.getElementById('orderModal').style.display = 'flex';
    };

    document.getElementById('orderQuantity').addEventListener('input', () => {
        const qty = parseInt(document.getElementById('orderQuantity').value) || 0;
        const total = qty * (currentOrderProduct?.price || 0);
        document.getElementById('orderTotal').innerText = total;
    });

    document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
        if (!currentUser) {
            alert('Please log in first');
            return;
        }
        
        const quantity = parseInt(document.getElementById('orderQuantity').value);
        const address = document.getElementById('orderAddress').value;
        
        if (!address) {
            alert('Please enter delivery address');
            return;
        }
        
        if (quantity < 1) {
            alert('Please enter valid quantity');
            return;
        }
        
        try {
            const productDoc = await db.collection('marketplace_products').doc(currentOrderProduct.id).get();
            if (!productDoc.exists) {
                alert('Product no longer available');
                document.getElementById('orderModal').style.display = 'none';
                loadProducts();
                return;
            }
            
            const product = productDoc.data();
            
            if (product.quantity < quantity) {
                alert(`Only ${product.quantity} ${product.unit}s available`);
                return;
            }
            
            const order = {
                productId: currentOrderProduct.id,
                productName: currentOrderProduct.name,
                buyerId: currentUser.uid,
                buyerName: userProfile?.name || currentUser.email.split('@')[0],
                farmerId: product.farmerId,
                farmerName: currentOrderProduct.farmerName,
                quantity: quantity,
                price: currentOrderProduct.price,
                total: quantity * currentOrderProduct.price,
                unit: currentOrderProduct.unit,
                address: address,
                status: 'pending',
                createdAt: new Date().toISOString(),
                createdAtDate: new Date().toLocaleDateString()
            };
            
            await db.collection('marketplace_orders').add(order);
            
            const newQuantity = product.quantity - quantity;
            if (newQuantity === 0) {
                await db.collection('marketplace_products').doc(currentOrderProduct.id).update({
                    quantity: newQuantity,
                    status: 'sold'
                });
            } else {
                await db.collection('marketplace_products').doc(currentOrderProduct.id).update({
                    quantity: newQuantity
                });
            }
            
            alert('Order placed successfully! The farmer will contact you soon.');
            document.getElementById('orderModal').style.display = 'none';
            loadProducts();
            if (document.querySelector('.tab[data-tab="orders"]').classList.contains('active')) {
                loadMyOrders();
            }
            
        } catch (error) {
            console.error('Order error:', error);
            alert('Failed to place order. Please try again.');
        }
    });

    document.getElementById('closeOrderModalBtn').addEventListener('click', () => {
        document.getElementById('orderModal').style.display = 'none';
    });

    document.getElementById('sellForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!currentUser) {
            alert('Please log in first');
            return;
        }
        
        const name = document.getElementById('productName').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const quantity = parseFloat(document.getElementById('productQuantity').value);
        
        if (!name) {
            document.getElementById('sellMessage').innerHTML = '<div class="error-message">Please enter product name</div>';
            return;
        }
        if (isNaN(price) || price <= 0) {
            document.getElementById('sellMessage').innerHTML = '<div class="error-message">Please enter valid price</div>';
            return;
        }
        if (isNaN(quantity) || quantity <= 0) {
            document.getElementById('sellMessage').innerHTML = '<div class="error-message">Please enter valid quantity</div>';
            return;
        }
        
        const product = {
            name: name,
            category: document.getElementById('productCategory').value,
            unit: document.getElementById('productUnit').value,
            price: price,
            quantity: quantity,
            description: document.getElementById('productDescription').value || '',
            farmerId: currentUser.uid,
            farmerName: userProfile?.name || currentUser.email.split('@')[0],
            status: 'available',
            createdAt: new Date().toISOString(),
            createdAtDate: new Date().toLocaleDateString()
        };
        
        try {
            await db.collection('marketplace_products').add(product);
            document.getElementById('sellMessage').innerHTML = '<div class="success-message">✓ Product listed successfully!</div>';
            document.getElementById('sellForm').reset();
            setTimeout(() => {
                document.getElementById('sellMessage').innerHTML = '';
                document.querySelector('.tab[data-tab="listings"]').click();
            }, 2000);
        } catch (error) {
            console.error('Error listing product:', error);
            document.getElementById('sellMessage').innerHTML = '<div class="error-message">Failed to list product. Error: ' + error.message + '</div>';
        }
    });

    async function loadMyListings() {
        const container = document.getElementById('myListingsContainer');
        container.innerHTML = '<div class="empty-state">Loading your listings...</div>';
        
        if (!currentUser) return;
        
        try {
            const snapshot = await db.collection('marketplace_products')
                .where('farmerId', '==', currentUser.uid)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-state">You haven\'t listed any products yet. Go to "Sell Your Harvest" to start!</div>';
                return;
            }
            
            let products = [];
            snapshot.forEach(doc => {
                const product = doc.data();
                product.id = doc.id;
                products.push(product);
            });
            products.sort((a, b) => {
                if (a.createdAt > b.createdAt) return -1;
                return 1;
            });
            
            let html = '';
            for (const product of products) {
                html += `
                    <div class="listing-card">
                        <div class="listing-info">
                            <h4>${escapeHtml(product.name)}</h4>
                            <p>RM${product.price} per ${product.unit} | ${product.quantity} ${product.unit}s left</p>
                            <span class="listing-status ${product.status}">${product.status}</span>
                        </div>
                        <div class="listing-actions">
                            <button onclick="deleteListing('${product.id}')" title="Delete listing"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="empty-state">Error loading your listings.</div>';
        }
    }

    window.deleteListing = async (productId) => {
        if (confirm('Delete this listing?')) {
            await db.collection('marketplace_products').doc(productId).delete();
            loadMyListings();
        }
    };

    async function loadMyOrders() {
        const container = document.getElementById('ordersContainer');
        container.innerHTML = '<div class="empty-state">Loading your orders...</div>';
        
        if (!currentUser) return;
        
        try {
            const snapshot = await db.collection('marketplace_orders')
                .where('buyerId', '==', currentUser.uid)
                .get();
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-state">You haven\'t placed any orders yet.</div>';
                return;
            }
            
            let orders = [];
            snapshot.forEach(doc => {
                const order = doc.data();
                order.id = doc.id;
                orders.push(order);
            });
            orders.sort((a, b) => {
                if (a.createdAt > b.createdAt) return -1;
                return 1;
            });
            
            let html = '';
            for (const order of orders) {
                html += `
                    <div class="listing-card">
                        <div class="listing-info">
                            <h4>${escapeHtml(order.productName)}</h4>
                            <p>${order.quantity} ${order.unit} × RM${order.price} = RM${order.total}</p>
                            <p><strong>From:</strong> ${escapeHtml(order.farmerName)}</p>
                            <p><strong>Status:</strong> <span class="listing-status ${order.status}">${order.status}</span></p>
                            <p><small>Ordered: ${order.createdAtDate}</small></p>
                            <p><small>Deliver to: ${escapeHtml(order.address)}</small></p>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="empty-state">Error loading your orders.</div>';
        }
    }

    auth.onAuthStateChanged(async (user) => {
        if (user && user.emailVerified) {
            currentUser = user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            userProfile = userDoc.exists ? userDoc.data() : { name: user.email.split('@')[0] };
            loadProducts();
        } else {
            window.location.href = 'index.html';
        }
    });
</script>

</body>
</html>
